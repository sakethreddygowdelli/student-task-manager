
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Student Task Manager</h1>

    <form id="taskForm" class="card card-body mb-4">
      <input id="title" class="form-control mb-3" placeholder="Task title" required>
      <input id="description" class="form-control mb-3" placeholder="Description">
      <button class="btn btn-primary">Add Task</button>
    </form>

    <div id="tasks"></div>
  </div>

  <script>
    const form = document.getElementById('taskForm');
    const list = document.getElementById('tasks');

    async function loadTasks() {
      const response = await fetch('/api/tasks');
      const tasks = await response.json();

      list.innerHTML = '';
      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'card card-body mb-2';

        const title = document.createElement('h5');
        title.textContent = task.title;
        if (task.completed) title.classList.add('text-decoration-line-through');

        const description = document.createElement('p');
        description.textContent = task.description || '';

        const complete = document.createElement('button');
        complete.className = 'btn btn-success me-2';
        complete.textContent = task.completed ? 'Mark Pending' : 'Complete';
        complete.onclick = async () => {
          await fetch('/api/tasks/' + task.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({completed: !task.completed})
          });
          loadTasks();
        };

        const remove = document.createElement('button');
        remove.className = 'btn btn-danger';
        remove.textContent = 'Delete';
        remove.onclick = async () => {
          await fetch('/api/tasks/' + task.id, {method: 'DELETE'});
          loadTasks();
        };

        card.append(title, description, complete, remove);
        list.append(card);
      });
    }

    form.onsubmit = async event => {
      event.preventDefault();
      await fetch('/api/tasks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          title: document.getElementById('title').value,
          description: document.getElementById('description').value
        })
      });
      form.reset();
      loadTasks();
    };

    loadTasks();
  </script>
</body>
</html>
